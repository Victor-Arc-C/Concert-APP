<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fd" />
    <title>Sortie · feed prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Kalam:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/proto.css" />
    <style>
      :root {
        --stock: #f7f9fd;
        --card: #ffffff;
        --rule: #cfdff3;
        --ink: #1d2f96;
        --ink-soft: #3e4fa8;
        --pencil: #636a7e;
        --stripe: #d92b1e;
        --shell: #1f2230;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --hand: 'Kalam', 'Marker Felt', 'Comic Sans MS', cursive;
        --print: 'Archivo', system-ui, sans-serif;
      }
      ::selection {
        background: var(--ink);
        color: var(--stock);
      }
      body {
        font-family: var(--print);
        color: var(--ink);
        background: var(--stock);
      }
      .device {
        background: var(--stock);
      }
      .screen {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: calc(var(--safe-top) + 4px) 0 calc(var(--safe-bottom) + 100px);
        scrollbar-width: none;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }
      :focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
        border-radius: 6px;
      }
      button {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      /* The spine: brand, stripe, the city. */
      .spine {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px 10px;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        text-decoration: none;
        font: italic 900 25px/1 var(--print);
        font-stretch: 125%;
        letter-spacing: -0.01em;
      }
      .reels {
        width: 38px;
        height: 22px;
        color: var(--stripe);
      }
      .spacer {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 44px;
        min-width: 44px;
        padding: 0 12px;
        border: 1.5px solid var(--rule);
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
        font: 700 15px var(--print);
        position: relative;
        transition: transform 120ms var(--ease-out);
      }
      .btn.icon {
        padding: 0;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn .badge {
        position: absolute;
        top: 8px;
        right: 9px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--stripe);
        box-shadow: 0 0 0 2px var(--card);
      }
      .stripes {
        height: 6px;
        margin: 0 16px;
        border-radius: 3px;
        background: var(--stripe);
      }
      h1 {
        margin: 18px 16px 0;
        font: 700 38px/1 var(--hand);
        color: var(--ink);
        rotate: -1deg;
      }
      .sample {
        margin: 6px 16px 0;
        font-size: 13px;
        color: var(--pencil);
      }
      .notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 14px 16px 0;
        padding: 12px 14px;
        border-radius: 16px;
        background: var(--card);
        border: 1.5px solid var(--rule);
        font-size: 14px;
        line-height: 1.4;
      }
      .notice svg {
        flex-shrink: 0;
        color: var(--stripe);
        margin-top: 1px;
      }
      .notice button {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--ink);
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 0 0 0 8px;
      }

      /* The J-card front: the next show, photo first. */
      .cover {
        position: relative;
        margin: 16px 16px 0;
        height: 196px;
        border-radius: 18px;
        overflow: hidden;
        background: var(--shell);
      }
      .cover .ph {
        position: absolute;
        inset: 0;
        background: var(--shell);
        color: var(--stock);
      }
      .cover .ph img {
        object-position: 50% 25%;
      }
      .cover .ph.is-missing {
        place-items: start end;
        padding: 14px 20px;
        background:
          repeating-linear-gradient(180deg, transparent 0 31px, rgb(247 249 253 / 0.16) 31px 33px),
          var(--ink);
      }
      .cover .ph-fallback {
        font: 700 92px/1 var(--hand);
        rotate: -4deg;
      }
      .cover figcaption {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: calc(100% - 24px);
        padding: 8px 12px 10px;
        border-radius: 12px;
        background: var(--card);
        rotate: -1.5deg;
        box-shadow: 0 10px 20px -12px rgb(15 20 40 / 0.6);
      }
      .cover figcaption span {
        display: block;
        font: 400 15px/1 var(--hand);
        color: var(--pencil);
      }
      .cover figcaption b {
        display: block;
        margin-top: 2px;
        font: 700 26px/1.05 var(--hand);
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .cover figcaption small {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      /* Signature: the cassette switch. Tap a side, or swipe the inlay sideways to flip it. */
      .cassette {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin: 18px 16px 0;
        padding: 6px;
        border-radius: 18px;
        background: var(--shell);
      }
      .cassette button {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 12px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: #c9d2ee;
        text-align: left;
        transition: color 200ms ease;
      }
      .cassette button b {
        font: italic 900 30px/1 var(--print);
        font-stretch: 125%;
      }
      .cassette button span {
        font: 700 13px/1.2 var(--print);
      }
      .cassette button span small {
        display: block;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .cassette button[aria-pressed='true'] {
        color: var(--ink);
      }
      .cassette .label {
        position: absolute;
        top: 6px;
        bottom: 6px;
        left: 6px;
        width: calc(50% - 9px);
        border-radius: 13px;
        background: var(--stock);
        box-shadow: inset 0 -3px 0 var(--stripe);
        transition: transform 380ms var(--ease-in-out);
      }
      .cassette[data-side='B'] .label {
        transform: translateX(calc(100% + 6px));
      }

      .inlay {
        perspective: 1800px;
        margin: 14px 16px 0;
        touch-action: pan-y;
      }
      .card {
        border-radius: 18px;
        background: var(--card);
        border: 1.5px solid var(--rule);
        padding: 4px 14px 8px;
        transform-origin: 50% 40%;
        will-change: transform;
        backface-visibility: hidden;
      }
      .side-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0 8px;
        border-bottom: 2px solid var(--ink);
      }
      .side-head b {
        font: italic 900 15px/1 var(--print);
        font-stretch: 120%;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .side-head span {
        font-size: 13px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .tracks {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .track {
        display: grid;
        grid-template-columns: 26px 44px minmax(0, 1fr) 44px;
        gap: 10px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1.5px solid var(--rule);
      }
      .track:last-child {
        border-bottom: 0;
      }
      .no {
        font: 700 18px/44px var(--hand);
        color: var(--ink-soft);
      }
      .track .ph {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #e6ecf8;
        color: var(--ink);
      }
      .track .ph-fallback {
        font: 700 17px/1 var(--hand);
      }
      .who {
        min-width: 0;
      }
      .who strong {
        display: block;
        font: 700 22px/1.08 var(--hand);
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .who .where {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        line-height: 1.35;
        color: var(--ink-soft);
      }
      .who .facts {
        display: block;
        margin-top: 4px;
        font-size: 13.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
      }
      .pencil {
        font: 400 15px/1 var(--hand);
        color: var(--pencil);
        font-weight: 400;
      }
      .struck {
        text-decoration: line-through;
        text-decoration-color: var(--stripe);
        text-decoration-thickness: 2px;
      }
      .flag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--stripe);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }
      /* Saving ticks the box in ballpoint. */
      .tick {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
        color: var(--ink);
        padding: 0;
      }
      .tick svg {
        width: 30px;
        height: 30px;
        overflow: visible;
      }
      .tick rect {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2;
      }
      .tick path {
        fill: none;
        stroke: var(--ink);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        transition: stroke-dashoffset 180ms var(--ease-out);
      }
      .tick[aria-pressed='true'] path {
        stroke-dashoffset: 0;
        transition: stroke-dashoffset 380ms var(--ease-in-out);
      }
      .tick:active svg {
        transform: scale(0.9);
      }
      .tick:disabled {
        opacity: 0.35;
      }
      @media (prefers-reduced-motion: reduce) {
        .tick path,
        .tick[aria-pressed='true'] path {
          stroke-dashoffset: 0;
          opacity: 0;
          transition: opacity 180ms ease;
        }
        .tick[aria-pressed='true'] path {
          opacity: 1;
        }
        .cassette .label {
          transition: none;
        }
        .card {
          transition: opacity 200ms ease;
        }
      }
      .empty {
        padding: 22px 6px 14px;
        text-align: center;
      }
      .empty b {
        display: block;
        font: 700 28px/1.05 var(--hand);
      }
      .empty p {
        margin: 8px auto 16px;
        max-width: 30ch;
        font-size: 15px;
        line-height: 1.45;
        color: var(--ink-soft);
      }
      .solid {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        background: var(--ink);
        color: var(--stock);
        font: 800 16px var(--print);
        transition: transform 120ms var(--ease-out);
      }
      .solid:active {
        transform: scale(0.97);
      }
      .hint {
        margin: 10px 16px 0;
        text-align: center;
        font: 400 15px/1.3 var(--hand);
        color: var(--pencil);
      }

      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(var(--safe-bottom) + 86px);
        z-index: 35;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 12px 12px 16px;
        border-radius: 16px;
        background: var(--shell);
        color: var(--stock);
        font-weight: 600;
        font-size: 15px;
        transform: translateY(16px);
        opacity: 0;
        transition:
          transform 300ms ease,
          opacity 300ms ease;
        pointer-events: none;
      }
      .toast.show {
        transform: none;
        opacity: 1;
        pointer-events: auto;
      }
      .toast button {
        margin-left: auto;
        height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: rgb(255 255 255 / 0.12);
        color: var(--stock);
        font-weight: 800;
      }
      .tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 6px 4px calc(var(--safe-bottom) + 4px);
        background: var(--card);
        border-top: 1.5px solid var(--rule);
      }
      .tabs a {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 3px;
        min-height: 50px;
        padding-top: 6px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 600;
        text-decoration: none;
      }
      .tabs a[aria-current] {
        color: var(--ink);
        font-weight: 800;
      }
      .tabs a[aria-current]::after {
        content: '';
        position: absolute;
        bottom: -2px;
        width: 22px;
        height: 3px;
        border-radius: 2px;
        background: var(--stripe);
      }
      .tabs .count {
        position: absolute;
        top: 0;
        left: calc(50% + 6px);
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--stripe);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        line-height: 18px;
      }
    </style>
  </head>
  <body class="phone-page">
    <div class="device">
      <div class="screen" id="screen"></div>
      <div class="toast" role="status" aria-live="polite" id="toast"></div>
      <nav class="tabs" aria-label="Main"></nav>
    </div>
    <script src="../shared/icons.js"></script>
    <script src="../shared/data.js"></script>
    <script src="../shared/proto.js"></script>
    <script>
      const { shows, mode, providerError, note } = PROTO;
      const { dateParts, money, esc, Spring, photo, project, reduceQuery } = P;
      if (PROTO.embed) document.body.classList.add('embed');
      const screen = document.getElementById('screen');
      const saved = new Set(mode === 'demo' ? ['kendrick-ams'] : []);
      let side = 'A';

      const reels = `<svg class="reels" viewBox="0 0 38 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3"><circle cx="9" cy="10" r="7"/><circle cx="29" cy="10" r="7"/></g><g fill="currentColor"><circle cx="9" cy="10" r="2.4"/><circle cx="29" cy="10" r="2.4"/></g><path d="M9 17 H29" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;
      const box = `<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="5" y="7" width="18" height="18" rx="3"/><path d="M8 16 L13.5 21.5 L27 4"/></svg>`;

      const facts = (s) => {
        const p = dateParts(s.date);
        const bits = [`${p.dow} ${p.dd}.${p.mm}`];
        if (s.time) bits.push(s.time);
        else bits.push(`<span class="pencil">time?</span>`);
        if (s.status === 'cancelled') bits.push(`<span class="flag">Cancelled</span>`);
        else if (s.status === 'postponed') bits.push(`<span class="flag">Postponed</span>`);
        else bits.push(money(s.price) ? `from ${money(s.price)}` : `<span class="pencil">price not listed</span>`);
        if (s.travel)
          bits.push(
            s.travel.duration
              ? `${s.travel.mode === 'flight' ? 'flight' : 'train'} ${s.travel.duration}`
              : `<span class="pencil">no timetable yet</span>`,
          );
        return bits.join(' · ');
      };

      const track = (s, i) => {
        const off = s.status === 'cancelled';
        const p = dateParts(s.date);
        return `<li class="track" data-id="${s.id}">
          <span class="no">${String(i + 1).padStart(2, '0')}</span>
          ${photo(s)}
          <span class="who">
            <strong class="${off ? 'struck' : ''}">${esc(s.artist)}</strong>
            <span class="where">${esc(s.venue)} · ${esc(s.city)}</span>
            <span class="facts">${facts(s)}</span>
          </span>
          <button class="tick" aria-pressed="${saved.has(s.id)}" ${off ? 'disabled' : ''} aria-label="Save ${esc(s.artist)}, ${p.full}">${box}</button>
        </li>`;
      };

      const sideShows = (k) => shows.filter((s) => (k === 'A' ? s.home : !s.home));

      function cardHTML(k) {
        const list = sideShows(k);
        const title = k === 'A' ? 'Side A · In Paris' : 'Side B · Worth the trip';
        if (!list.length)
          return `<div class="side-head"><b>${title}</b><span>0 shows</span></div>
            <div class="empty"><b>Blank side</b><p>${k === 'A' ? 'None of your artists plays in Paris yet.' : 'No trips to plan right now.'}</p></div>`;
        return `<div class="side-head"><b>${title}</b><span>${list.length} ${list.length === 1 ? 'show' : 'shows'}</span></div>
          <ol class="tracks">${list.map(track).join('')}</ol>`;
      }

      function render() {
        const head = `<header class="spine"><a class="wordmark" href="#" aria-label="Sortie home">${reels}sortie</a><span class="spacer"></span>
          <button class="btn" aria-label="Home city: Paris">${icon('map-pin', 17, 2.4)}Paris</button>
          <button class="btn icon" aria-label="Alerts, 1 new">${icon('bell', 20, 2.3)}<span class="badge"></span></button></header>
          <div class="stripes" aria-hidden="true"></div>`;
        if (mode === 'error') {
          screen.innerHTML = `${head}<h1>Your shows</h1>
            <div class="notice" role="alert">${icon('circle-alert', 18, 2.4)}<span>${esc(providerError)}</span></div>
            <div class="inlay"><div class="card"><div class="empty"><b>Can’t load dates</b><p>Your artists and ticked shows are safe. Try again in a minute.</p><button class="solid">${icon('refresh-cw', 18, 2.4)}Try again</button></div></div></div>`;
          return;
        }
        if (!shows.length) {
          screen.innerHTML = `${head}<h1>Your shows</h1><p class="sample">${esc(note)}</p>
            <div class="inlay"><div class="card"><div class="empty"><b>Nothing recorded yet</b><p>None of your artists has announced a show. We’ll write it in the moment one does.</p><button class="solid">${icon('plus', 18, 2.6)}Add artists</button></div></div></div>`;
          return;
        }
        const a = sideShows('A').length;
        const b = sideShows('B').length;
        const next = shows.find((s) => s.status !== 'cancelled') ?? shows[0];
        const np = dateParts(next.date);
        screen.innerHTML = `${head}
          <h1>Your shows</h1>
          <p class="sample">${esc(note)}</p>
 ${providerError ? `<div class="notice">${icon('circle-alert', 18, 2.4)}<span>${esc(providerError)}</span><button>Refresh</button></div>` : ''}
          <figure class="cover">${photo(next)}<figcaption><span>Up next</span><b>${esc(next.artist)}</b><small>${np.dow} ${np.dd}.${np.mm} · ${esc(next.venue)}</small></figcaption></figure>
          <div class="cassette" data-side="A" role="group" aria-label="Choose a side">
            <span class="label" aria-hidden="true"></span>
            <button aria-pressed="true" data-side="A"><b>A</b><span>In Paris<small>${a} ${a === 1 ? 'show' : 'shows'}</small></span></button>
            <button aria-pressed="false" data-side="B"><b>B</b><span>Worth the trip<small>${b} ${b === 1 ? 'show' : 'shows'}</small></span></button>
          </div>
          <div class="inlay" id="inlay"><div class="card" id="card">${cardHTML('A')}</div></div>
          <p class="hint">Swipe the card sideways to turn the tape over.</p>`;
        wireFlip();
      }

      // The flip is one spring on an angle: 0 = side A, 180 = side B. Past 90° the card is edge-on,
      // so that is where its contents change. A swipe drags the angle 1:1 and hands its velocity on.
      function wireFlip() {
        const inlay = document.getElementById('inlay');
        const card = document.getElementById('card');
        const cassette = document.querySelector('.cassette');
        let shown = 'A';
        const paint = (deg) => {
          const want = deg < 90 ? 'A' : 'B';
          if (want !== shown) {
            shown = want;
            card.innerHTML = cardHTML(want);
          }
          const visual = want === 'A' ? -deg : 180 - deg;
          card.style.transform = reduceQuery.matches ? 'none' : `rotateY(${visual}deg)`;
        };
        const spring = new Spring({ value: 0, response: 0.5, damping: 0.86, onUpdate: paint });
        const setSide = (k, velocity) => {
          side = k;
          cassette.dataset.side = k;
          cassette.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.side === k));
          if (reduceQuery.matches) {
            card.style.opacity = 0;
            setTimeout(() => {
              spring.set(k === 'A' ? 0 : 180);
              card.style.opacity = 1;
            }, 160);
            return;
          }
          spring.to(k === 'A' ? 0 : 180, { velocity });
        };
        cassette.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (b && b.dataset.side !== side) setSide(b.dataset.side);
        });

        let start = null;
        let dragging = false;
        let samples = [];
        inlay.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.tick')) return;
          start = { x: e.clientX, y: e.clientY, deg: spring.value, id: e.pointerId };
          dragging = false;
          samples = [[e.timeStamp, e.clientX]];
        });
        inlay.addEventListener('pointermove', (e) => {
          if (!start || e.pointerId !== start.id) return;
          const dx = e.clientX - start.x;
          const dy = e.clientY - start.y;
          if (!dragging) {
            if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
            dragging = true;
            inlay.setPointerCapture(e.pointerId);
            spring.stop();
          }
          const perPx = 180 / inlay.offsetWidth;
          let deg = start.deg - dx * perPx;
          if (deg < 0) deg = deg / 3;
          if (deg > 180) deg = 180 + (deg - 180) / 3;
          spring.value = deg;
          paint(deg);
          samples.push([e.timeStamp, e.clientX]);
          if (samples.length > 5) samples.shift();
        });
        const end = (e) => {
          if (!start) return;
          if (dragging) {
            const [t0, x0] = samples[0];
            const vx = ((e.clientX - x0) / Math.max(1, e.timeStamp - t0)) * 1000;
            const degV = (-vx * 180) / inlay.offsetWidth;
            const projected = spring.value + project(degV, 0.99);
            setSide(projected >= 90 ? 'B' : 'A', degV);
          }
          start = null;
          dragging = false;
        };
        inlay.addEventListener('pointerup', end);
        inlay.addEventListener('pointercancel', end);
      }

      let toastTimer;
      function toast(message, undo) {
        const el = document.getElementById('toast');
        el.innerHTML = `<span>${message}</span>${undo ? '<button>Undo</button>' : ''}`;
        el.classList.add('show');
        el.querySelector('button')?.addEventListener('click', () => {
          undo();
          el.classList.remove('show');
        });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
      }
      function toggleSave(id) {
        const s = shows.find((x) => x.id === id);
        const on = !saved.has(id);
        on ? saved.add(id) : saved.delete(id);
        const b = document.querySelector(`.track[data-id="${id}"] .tick`);
        b?.setAttribute('aria-pressed', on);
        renderTabs();
        if (on) toast(`Ticked. ${s.artist} is on your tape.`, () => toggleSave(id));
      }
      screen.addEventListener('click', (e) => {
        const t = e.target.closest('.tick');
        if (t) toggleSave(t.closest('.track').dataset.id);
      });

      function renderTabs() {
        const tabs = [
          ['For you', 'compass', true],
          ['Ticked', 'bookmark'],
          ['Trips', 'route'],
          ['Artists', 'heart'],
          ['Alerts', 'bell'],
        ];
        document.querySelector('.tabs').innerHTML = tabs
          .map(
            ([label, ico, current]) =>
              `<a href="#" ${current ? 'aria-current="page"' : ''}>${icon(ico, 22, current ? 2.5 : 2.1)}${label}${
                label === 'Ticked' && saved.size ? `<span class="count">${saved.size}<span class="vh"> saved</span></span>` : ''
              }</a>`,
          )
          .join('');
      }

      render();
      renderTabs();
      P.mountDataToggle();
    </script>
  </body>
</html>
