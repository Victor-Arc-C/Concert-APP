<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaff" />
    <title>Showbound · feed prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/proto.css" />
    <style>
      @property --g1 {
        syntax: '<color>';
        inherits: true;
        initial-value: #ff3d7f;
      }
      @property --g2 {
        syntax: '<color>';
        inherits: true;
        initial-value: #1fb6ff;
      }
      @property --g3 {
        syntax: '<color>';
        inherits: true;
        initial-value: #ffaa00;
      }
      :root {
        --cyc: #efeafb;
        --haze-deep: #e4dcf8;
        --white: #ffffff;
        --ink: #15122b;
        --ink-soft: #4a4566;
        --truss: #2b2840;
        --line: #ddd5f2;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        --text: 'Bricolage Grotesque', system-ui, sans-serif;
      }
      ::selection {
        background: var(--ink);
        color: var(--white);
      }
      body {
        font-family: var(--text);
        color: var(--ink);
        background: var(--cyc);
      }
      .device {
        background: var(--cyc);
        --g1: #ff3d7f;
        --g2: #1fb6ff;
        --g3: #ffaa00;
        transition:
          --g1 700ms ease,
          --g2 700ms ease,
          --g3 700ms ease;
      }
      .device[data-cue='home'] {
        --g1: #ffaa00;
        --g2: #ff6a3d;
        --g3: #ffaa00;
      }
      .device[data-cue='trip'] {
        --g1: #1fb6ff;
        --g2: #7a5cff;
        --g3: #1fb6ff;
      }
      /* The rig: a truss, three moving heads, beams on springs that wash the haze. */
      .rig {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: calc(var(--safe-top) + 64px);
        z-index: 2;
        pointer-events: none;
      }
      .beams {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .beam {
        position: absolute;
        top: calc(var(--safe-top) + 46px);
        width: 300px;
        height: 88%;
        margin-left: -150px;
        clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
        background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), var(--c) 50%, color-mix(in srgb, var(--c) 30%, transparent));
        mix-blend-mode: multiply;
        opacity: 0;
        transform-origin: 50% 0;
        -webkit-mask-image: linear-gradient(#000 0%, rgb(0 0 0 / 0.6) 45%, transparent 100%);
        mask-image: linear-gradient(#000 0%, rgb(0 0 0 / 0.6) 45%, transparent 100%);
        transition: opacity 600ms ease;
        will-change: transform;
      }
      .beam.on {
        opacity: 0.46;
      }
      .beam:nth-child(1) {
        left: 15%;
        --c: var(--g1);
      }
      .beam:nth-child(2) {
        left: 50%;
        --c: var(--g2);
      }
      .beam:nth-child(3) {
        left: 85%;
        --c: var(--g3);
      }
      .beam.spot {
        left: 50%;
        --c: #ffffff;
        background: linear-gradient(90deg, rgb(255 255 255 / 0.2), rgb(255 250 235 / 0.95) 50%, rgb(255 255 255 / 0.2));
        mix-blend-mode: normal;
        z-index: 3;
      }
      .truss {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--safe-top);
        height: 12px;
        background:
          repeating-linear-gradient(60deg, transparent 0 5px, #4a4468 5px 7px),
          repeating-linear-gradient(-60deg, transparent 0 5px, #4a4468 5px 7px),
          var(--truss);
        box-shadow:
          inset 0 2px 0 #3d3858,
          inset 0 -2px 0 #3d3858;
      }
      .lamp {
        position: absolute;
        top: calc(var(--safe-top) + 9px);
        width: 40px;
        height: 40px;
        translate: -50% 0;
      }
      .lamp::before {
        content: '';
        position: absolute;
        left: 5px;
        right: 5px;
        top: 0;
        height: 22px;
        border: 4px solid var(--truss);
        border-top: 0;
        border-radius: 0 0 12px 12px;
      }
      .lamp .head {
        position: absolute;
        left: 8px;
        top: 6px;
        width: 24px;
        height: 28px;
        border-radius: 8px 8px 10px 10px;
        background: linear-gradient(#3a3556, var(--truss));
        transform-origin: 50% 30%;
      }
      .lamp .lens {
        position: absolute;
        left: 50%;
        bottom: 3px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        translate: -50% 0;
        background: #4a4468;
      }
      .lamp .lens::after {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        background: radial-gradient(circle, color-mix(in srgb, var(--c) 70%, white) 0 18%, color-mix(in srgb, var(--c) 40%, transparent) 36%, transparent 70%);
        opacity: 0;
      }
      .lamp.on .lens {
        background: radial-gradient(circle, #fff 0 30%, var(--c) 62%);
        animation: power 520ms steps(1, end) both;
      }
      .lamp.on .lens::after {
        opacity: 1;
        transition: opacity 600ms ease;
      }
      @keyframes power {
        0% {
          opacity: 0.25;
        }
        18% {
          opacity: 1;
        }
        32% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lamp.on .lens {
          animation: none;
        }
      }
      .screen {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: calc(var(--safe-top) + 40px) 0 calc(var(--safe-bottom) + 100px);
        scrollbar-width: none;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }
      :focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
        border-radius: 10px;
      }
      button {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 52px;
        padding: 0 16px;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: 800 24px/1 var(--text);
        font-variation-settings: 'opsz' 48;
        letter-spacing: -0.03em;
        color: var(--ink);
        text-decoration: none;
      }
      .logo svg {
        width: 26px;
        height: 26px;
      }
      .spacer {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 44px;
        min-width: 44px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--white);
        color: var(--ink);
        font: 600 15px var(--text);
        position: relative;
        transition: transform 120ms var(--ease-out);
      }
      .btn.icon {
        padding: 0;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn .badge {
        position: absolute;
        top: 9px;
        right: 10px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff3d7f;
        box-shadow: 0 0 0 2px var(--white);
      }
      h1 {
        margin: 22px 16px 0;
        font: 800 44px/0.95 var(--text);
        font-variation-settings: 'opsz' 96;
        letter-spacing: -0.04em;
      }
      .sample {
        margin: 8px 16px 0;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin: 14px 16px 0;
        padding: 12px 14px;
        border-radius: 16px;
        background: var(--white);
        border: 1px solid var(--line);
        font-size: 14px;
        line-height: 1.4;
      }
      .notice svg {
        flex-shrink: 0;
        margin-top: 1px;
      }
      .notice button {
        margin-left: auto;
        border: 0;
        background: none;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 0 0 0 8px;
      }
      /* Filters are lighting cues. */
      .cues {
        display: flex;
        gap: 8px;
        padding: 16px 16px 0;
      }
      .cues button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--white);
        color: var(--ink);
        font: 600 14px var(--text);
        transition:
          background-color 200ms ease,
          color 200ms ease,
          transform 120ms var(--ease-out);
      }
      .cues button i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--c);
      }
      .cues button span {
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .cues button[aria-pressed='true'] {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--white);
      }
      .cues button[aria-pressed='true'] span {
        color: #d6d2ee;
      }
      .cues button:active {
        transform: scale(0.96);
      }

      /* Show cards. Each artist has a gel; the card is lit as it crosses the middle of the screen. */
      .acts {
        display: grid;
        gap: 14px;
        padding: 18px 16px 0;
        margin: 0;
        list-style: none;
      }
      .act {
        position: relative;
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        gap: 14px;
        padding: 12px;
        border-radius: 26px;
        background: var(--white);
        border: 1px solid var(--line);
        overflow: hidden;
        isolation: isolate;
      }
      .act::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(170deg, var(--gel) 0%, transparent 70%);
        opacity: 0.16;
      }
      @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
          .act::before {
            animation: spot linear both;
            animation-timeline: view();
            animation-range: cover 0% cover 100%;
          }
          @keyframes spot {
            0% {
              opacity: 0.06;
            }
            45%,
            60% {
              opacity: 0.42;
            }
            100% {
              opacity: 0.06;
            }
          }
        }
      }
      .act.is-spotted::before {
        animation: none;
        opacity: 0.5;
      }
      .act.enter {
        animation: up 420ms var(--ease-out) both;
        animation-delay: calc(var(--i) * 40ms);
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .act .ph {
        width: 104px;
        height: 104px;
        border-radius: 20px;
        background: var(--gel);
        color: var(--ink);
      }
      /* Lit by the gel: a grey print, the colour multiplied on top. */
      .act .ph img {
        filter: grayscale(1) contrast(1.05) brightness(1.18);
        mix-blend-mode: multiply;
      }
      .act .ph-fallback {
        font: 800 30px/1 var(--text);
        letter-spacing: -0.03em;
      }
      .who {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .who strong {
        font: 800 23px/1.02 var(--text);
        font-variation-settings: 'opsz' 48;
        letter-spacing: -0.03em;
        overflow-wrap: anywhere;
      }
      .who .when {
        margin-top: 5px;
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .who .where {
        margin-top: 1px;
        font-size: 14px;
        line-height: 1.35;
        color: var(--ink-soft);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 9px;
        border-radius: 9px;
        background: var(--cyc);
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chip.quiet {
        font-weight: 500;
        color: var(--ink-soft);
      }
      .chip.stop {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--white);
      }
      .spot {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        padding: 0 13px 0 11px;
        border: 1px solid var(--ink);
        border-radius: 14px;
        background: var(--white);
        color: var(--ink);
        font: 700 14px var(--text);
        transition:
          background-color 220ms ease,
          color 220ms ease,
          transform 120ms var(--ease-out);
      }
      .spot[aria-pressed='true'] {
        background: var(--ink);
        color: var(--white);
      }
      .spot:active {
        transform: scale(0.95);
      }
      .spot:disabled {
        opacity: 0.4;
      }
      .act.is-off .who strong {
        text-decoration: line-through;
        text-decoration-thickness: 2px;
      }
      .act.is-off .ph {
        filter: grayscale(1);
        opacity: 0.6;
      }
      .empty {
        margin: 22px 16px 0;
        padding: 26px 20px;
        border-radius: 26px;
        background: var(--white);
        border: 1px solid var(--line);
        text-align: center;
      }
      .empty b {
        display: block;
        font: 800 26px/1.05 var(--text);
        letter-spacing: -0.03em;
      }
      .empty p {
        margin: 8px auto 16px;
        max-width: 30ch;
        font-size: 15px;
        line-height: 1.45;
        color: var(--ink-soft);
      }
      .solid {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 14px;
        background: var(--ink);
        color: var(--white);
        font: 700 16px var(--text);
      }
      @media (prefers-reduced-motion: reduce) {
        .act.enter {
          animation-name: fade;
        }
        @keyframes fade {
          from {
            opacity: 0;
          }
        }
        .device {
          transition: none;
        }
      }
      .toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(var(--safe-bottom) + 86px);
        z-index: 35;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 12px 12px 16px;
        border-radius: 16px;
        background: var(--ink);
        color: var(--white);
        font-weight: 500;
        font-size: 15px;
        transform: translateY(16px);
        opacity: 0;
        transition:
          transform 300ms ease,
          opacity 300ms ease;
        pointer-events: none;
      }
      .toast.show {
        transform: none;
        opacity: 1;
        pointer-events: auto;
      }
      .toast button {
        margin-left: auto;
        height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: var(--white);
        color: var(--ink);
        font-weight: 700;
      }
      .tabs {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 6px 4px calc(var(--safe-bottom) + 4px);
        background: var(--white);
        border-top: 1px solid var(--line);
      }
      .tabs a {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 3px;
        min-height: 50px;
        padding-top: 6px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
      }
      .tabs a[aria-current] {
        color: var(--ink);
        font-weight: 700;
      }
      .tabs a[aria-current]::after {
        content: '';
        position: absolute;
        bottom: -2px;
        width: 24px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, #ff3d7f, #ffaa00, #1fb6ff);
      }
      .tabs .count {
        position: absolute;
        top: 0;
        left: calc(50% + 6px);
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--ink);
        color: var(--white);
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
      }
    </style>
  </head>
  <body class="phone-page">
    <div class="device" id="device" data-cue="all">
      <div class="beams" aria-hidden="true"><span class="beam"></span><span class="beam"></span><span class="beam"></span><span class="beam spot"></span></div>
      <div class="rig" aria-hidden="true">
        <span class="truss"></span>
        <span class="lamp" style="left: 15%; --c: var(--g1)"><span class="head"><span class="lens"></span></span></span>
        <span class="lamp" style="left: 50%; --c: var(--g2)"><span class="head"><span class="lens"></span></span></span>
        <span class="lamp" style="left: 85%; --c: var(--g3)"><span class="head"><span class="lens"></span></span></span>
      </div>
      <div class="screen" id="screen"></div>
      <div class="toast" role="status" aria-live="polite" id="toast"></div>
      <nav class="tabs" aria-label="Main"></nav>
    </div>
    <script src="../shared/icons.js"></script>
    <script src="../shared/data.js"></script>
    <script src="../shared/proto.js"></script>
    <script>
      const { shows, mode, providerError, note } = PROTO;
      const { dateParts, money, esc, photo, Spring, reduceQuery } = P;
      const reduce = reduceQuery.matches;
      if (PROTO.embed) document.body.classList.add('embed');
      const screen = document.getElementById('screen');
      const device = document.getElementById('device');
      const spotted = new Set(mode === 'demo' ? ['kendrick-ams'] : []);
      let filter = 'all';
      // Each artist keeps one gel, chosen from their name so it never changes between visits.
      const GELS = ['#ff3d7f', '#1fb6ff', '#ffaa00', '#7be03a', '#a58bff', '#ff6a3d'];
      const gel = (name) => GELS[[...name].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % GELS.length];
      const logo = `<a class="logo" href="#" aria-label="Showbound home"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="8" y="1.5" width="10" height="7" rx="2.5" fill="#15122b"/><path d="M10 8.5 L4 22 H22 L16 8.5 Z" fill="#ff3d7f" opacity=".9"/><circle cx="13" cy="21" r="3.2" fill="#15122b"/></svg>showbound</a>`;

      const chips = (s) => {
        const out = [];
        if (s.status === 'cancelled') out.push(`<span class="chip stop">Cancelled</span>`);
        else if (s.status === 'postponed') out.push(`<span class="chip stop">Postponed</span>`);
        else out.push(money(s.price) ? `<span class="chip">From ${money(s.price)}</span>` : `<span class="chip quiet">Price not listed</span>`);
        if (s.travel)
          out.push(
            s.travel.duration
              ? `<span class="chip">${icon(s.travel.mode === 'flight' ? 'plane' : 'train-front', 14, 2.3)}${s.travel.duration}</span>`
              : `<span class="chip quiet">No timetable yet</span>`,
          );
        return out.join('');
      };
      const act = (s, i) => {
        const p = dateParts(s.date);
        const off = s.status === 'cancelled';
        const on = spotted.has(s.id);
        return `<li class="act enter ${on ? 'is-spotted' : ''} ${off ? 'is-off' : ''}" style="--i:${i};--gel:${gel(s.artist)}" data-id="${s.id}">
          ${photo(s)}
          <div class="who">
            <strong>${esc(s.artist)}</strong>
            <span class="when">${p.dow} ${p.day} ${p.mon}${s.time ? ` · ${s.time}` : ''}</span>
            <span class="where">${esc(s.venue)}, ${esc(s.city)}</span>
            <div class="row">${chips(s)}<button class="spot" aria-pressed="${on}" ${off ? 'disabled' : ''} aria-label="${on ? 'Spotted' : 'Spot'} ${esc(s.artist)}, ${p.full}">${icon(on ? 'check' : 'plus', 16, 2.6)}${on ? 'Going' : 'Save'}</button></div>
          </div>
        </li>`;
      };
      const visible = () => shows.filter((s) => (filter === 'home' ? s.home : filter === 'trip' ? !s.home : true));
      function renderActs() {
        const list = document.getElementById('acts');
        const items = visible();
        list.innerHTML = items.length
          ? items.map(act).join('')
          : `<li class="empty"><b>Nobody on</b><p>${filter === 'home' ? 'None of your artists plays in Paris yet.' : 'No trips to plan right now.'}</p></li>`;
      }
      function render() {
        const head = `<header class="top">${logo}<span class="spacer"></span>
          <button class="btn" aria-label="Home city: Paris">${icon('map-pin', 17, 2.3)}Paris</button>
          <button class="btn icon" aria-label="Alerts, 1 new">${icon('bell', 20, 2.2)}<span class="badge"></span></button></header>`;
        if (mode === 'error') {
          screen.innerHTML = `${head}<h1>Who’s on</h1><div class="notice" role="alert">${icon('circle-alert', 18, 2.4)}<span>${esc(providerError)}</span></div>
            <div class="empty"><b>Can’t load shows</b><p>Your artists and saved shows are safe. Try again in a minute.</p><button class="solid">${icon('refresh-cw', 18, 2.4)}Try again</button></div>`;
          return;
        }
        if (!shows.length) {
          screen.innerHTML = `${head}<h1>Who’s on</h1><p class="sample">${esc(note)}</p>
            <div class="empty"><b>The stage is empty</b><p>None of your artists has announced a date. You’ll see it here first.</p><button class="solid">${icon('plus', 18, 2.6)}Add artists</button></div>`;
          return;
        }
        const home = shows.filter((s) => s.home).length;
        screen.innerHTML = `${head}
          <h1>Who’s on</h1>
          <p class="sample">${esc(note)}</p>
          ${providerError ? `<div class="notice">${icon('circle-alert', 18, 2.4)}<span>${esc(providerError)}</span><button>Refresh</button></div>` : ''}
          <div class="cues" role="group" aria-label="Filter shows">
            <button aria-pressed="true" data-f="all" style="--c: #ff3d7f"><i></i>All <span>${shows.length}</span></button>
            <button aria-pressed="false" data-f="home" style="--c: #ffaa00"><i></i>Paris <span>${home}</span></button>
            <button aria-pressed="false" data-f="trip" style="--c: #1fb6ff"><i></i>Far <span>${shows.length - home}</span></button>
          </div>
          <ul class="acts" id="acts"></ul>`;
        renderActs();
      }

      let toastTimer;
      function toast(message, undo) {
        const el = document.getElementById('toast');
        el.innerHTML = `<span>${message}</span>${undo ? '<button>Undo</button>' : ''}`;
        el.classList.add('show');
        el.querySelector('button')?.addEventListener('click', () => {
          undo();
          el.classList.remove('show');
        });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
      }
      function toggleSpot(id) {
        const s = shows.find((x) => x.id === id);
        const on = !spotted.has(id);
        on ? spotted.add(id) : spotted.delete(id);
        const li = document.querySelector(`.act[data-id="${id}"]`);
        if (li) {
          li.classList.toggle('is-spotted', on);
          const b = li.querySelector('.spot');
          b.setAttribute('aria-pressed', on);
          b.innerHTML = `${icon(on ? 'check' : 'plus', 16, 2.6)}${on ? 'Going' : 'Save'}`;
        }
        renderTabs();
        if (on) {
          followSpot(li);
          toast(`Saved. ${s.artist} stays in the light.`, () => toggleSpot(id));
        }
      }
      screen.addEventListener('click', (e) => {
        const b = e.target.closest('.spot');
        if (b) return toggleSpot(b.closest('.act').dataset.id);
        const f = e.target.closest('.cues button');
        if (f && f.dataset.f !== filter) {
          filter = f.dataset.f;
          device.dataset.cue = filter;
          aimCue();
          document.querySelectorAll('.cues button').forEach((x) => x.setAttribute('aria-pressed', x === f));
          renderActs();
        }
      });
      function renderTabs() {
        const tabs = [
          ['For you', 'compass', true],
          ['Going', 'bookmark'],
          ['Trips', 'route'],
          ['Artists', 'heart'],
          ['Alerts', 'bell'],
        ];
        document.querySelector('.tabs').innerHTML = tabs
          .map(
            ([label, ico, current]) =>
              `<a href="#" ${current ? 'aria-current="page"' : ''}>${icon(ico, 22, current ? 2.4 : 2)}${label}${
                label === 'Going' && spotted.size ? `<span class="count">${spotted.size}<span class="vh"> saved</span></span>` : ''
              }</a>`,
          )
          .join('');
      }
      render();
      renderTabs();

      /* Rig: three moving heads on springs. Each filter is a lighting cue (angles and colours),
         scrolling sways the beams, and saving drops a white follow spot onto the card. */
      const beams = [...device.querySelectorAll('.beam:not(.spot)')];
      const heads = [...device.querySelectorAll('.lamp .head')];
      const lamps = [...device.querySelectorAll('.lamp')];
      const CUES = { all: [-14, 4, 16], home: [-26, -6, 8], trip: [-6, 12, 26] };
      let sway = 0;
      const springs = beams.map(
        (beam, i) =>
          new Spring({
            value: 0,
            response: 0.8,
            damping: 0.7,
            precision: 0.05,
            onUpdate: (d) => {
              beam.style.transform = `rotate(${d}deg)`;
              heads[i].style.transform = `rotate(${d * 0.7}deg)`;
            },
          }),
      );
      function aimCue() {
        const cue = CUES[filter] ?? CUES.all;
        springs.forEach((sp, i) => {
          const target = cue[i] + (i % 2 ? -sway : sway);
          reduce ? sp.set(cue[i]) : sp.to(target);
        });
      }
      lamps.forEach((lamp, i) =>
        setTimeout(() => {
          lamp.classList.add('on');
          beams[i].classList.add('on');
          const cue = CUES[filter] ?? CUES.all;
          reduce ? springs[i].set(cue[i]) : springs[i].to(cue[i]);
        }, reduce ? 0 : 250 + i * 180),
      );
      if (!reduce) {
        let raf = 0;
        screen.addEventListener(
          'scroll',
          () => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => {
              sway = Math.sin(screen.scrollTop / 240) * 7;
              aimCue();
            });
          },
          { passive: true },
        );
      }
      function followSpot(card) {
        if (reduce || !card) return;
        const spot = device.querySelector('.beam.spot');
        const d = device.getBoundingClientRect();
        const c = card.getBoundingClientRect();
        const bx = d.left + d.width / 2;
        const by = d.top + parseFloat(getComputedStyle(spot).top);
        const dx = c.left + c.width / 2 - bx;
        const dy = c.top + c.height / 2 - by;
        spot.style.height = `${Math.hypot(dx, dy) + c.height / 2}px`;
        spot.style.transform = `rotate(${(Math.atan2(dx, dy) * -180) / Math.PI}deg)`;
        spot.animate([{ opacity: 0 }, { opacity: 0.9, offset: 0.2 }, { opacity: 0.75, offset: 0.7 }, { opacity: 0 }], { duration: 1100, easing: 'ease-out' });
        card.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.02)', offset: 0.3 }, { transform: 'scale(1)' }], { duration: 520, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
      }
      P.mountDataToggle();
    </script>
  </body>
</html>
